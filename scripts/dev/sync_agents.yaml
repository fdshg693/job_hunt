# sync_agents.py の同期設定: .agents/（正本）から .claude/ へ同期しないものを指定する。
#
# 形式: ターゲット（rules / skills / agents）ごとに exclude（パターンのリスト）だけを持つ。
#   - パターンはトップレベル名（スキルはディレクトリ名、ルール・エージェントはファイル名かディレクトリ名）に
#     対する fnmatch。例: "antigravity-*", "goal.md"
#   - 既定はすべて同期する（ホワイトリストにはしない）。除外するときは理由をコメントで添える。
#   - 除外したものが .claude/ に既にあると、同期時に「余剰」として削除される（除外 = .claude/ に置かない）。
#   - 未知のキー・型違いはエラー。どのソースにも一致しないパターンは警告（消したスキルの残骸）。

rules:
  exclude: []

skills:
  exclude: []

agents:
  exclude: []
