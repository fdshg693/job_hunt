{% extends "base.html" %}
{% block title %}スクリーニング{% endblock %}
{% block content %}
<h1>スクリーニングで見送った企業</h1>
<p class="muted">求人票の一次スクリーニングで早めに打ち切った企業（同じ track では <code>check_company.py</code> が除外扱いにする）。</p>
<form class="filters" action="/screening" method="get" hx-get="/screening" hx-target="#results" hx-push-url="true"
      hx-trigger="change, input changed delay:300ms from:input[type=search]">
  <div class="filter-row">
    <input type="search" name="q" value="{{ query.get('q', '') }}" placeholder="社名・理由を検索" class="grow" aria-label="検索">
    <label>track
      <select name="track">
        <option value="">すべて</option>
        {% for value, lbl in track_options %}<option value="{{ value }}" {% if track == value %}selected{% endif %}>{{ lbl }}</option>{% endfor %}
      </select>
    </label>
    {% if query.get('batch') %}<input type="hidden" name="batch" value="{{ query.get('batch') }}"><a class="small" href="/screening">バッチの絞り込みを外す</a>{% endif %}
  </div>
  <noscript><button type="submit">絞り込む</button></noscript>
</form>
<div id="results">{% include "_screening_table.html" %}</div>
{% endblock %}
